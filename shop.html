<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRUVEA | Shop Smart Crunches</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="FRUVEA home">
        <div class="logo">
          <svg class="logo-leaf" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M19 5c-5.2.3-8.6 2.3-10.9 5.3-2.6 3.4-3.6 7.5-3.6 9.7 1.8 0 5.7-.6 9.1-2.8 3.8-2.4 6.2-6.3 6.2-12.2z"></path>
            <path d="M7.2 16.5c2.8-2.2 6.2-3.8 10.1-4.9"></path>
          </svg>
          <span class="logo-text">FRUVEA</span>
        </div>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link is-active" href="shop.html">Shop</a>
        <a class="nav-link" href="cart.html">Cart <span class="cart-count" data-cart-count>0</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Shop FRUVEA</h1>
        <p>Select your category and explore all available products.</p>
      </div>
    </section>

    <section class="shop-section">
      <div class="container">
        <div id="category-filters" class="filter-row" role="group" aria-label="Product categories"></div>
        <div id="product-list" class="product-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 FRUVEA. Healthy crunches & powders.</p>
    </div>
  </footer>

  <script src="js/data.js" defer></script>
  <script src="js/cart-count.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
